services:

  inventory-service:
    build: .
    environment:
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      PRICING_URL: http://host.docker.internal:8081
      PORT: "8080"
      FAULT_SLOW_QUERY_SECONDS: "0"
      OTEL_SERVICE_NAME: inventory-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started