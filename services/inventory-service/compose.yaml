name: shop-local

# inventory-service en conteneur, adossé au socle mutualisé (Postgres + Collector).
#
# Depuis la racine du dépôt :  docker compose up --build inventory-service
# Depuis ce dossier :          docker compose up --build
#
# PRICING_URL pointe par défaut sur le conteneur pricing-service ; pour appeler
# un pricing-service lancé sur l'hôte (cargo run), surcharger la variable :
#   PRICING_URL=http://host.docker.internal:8082 docker compose up --build

include:
  - ../compose.yaml

services:
  inventory-service:
    build: .
    environment:
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      PRICING_URL: ${PRICING_URL:-http://pricing-service:8080}
      PORT: "8080"
      FAULT_SLOW_QUERY_SECONDS: "0"
      OTEL_SERVICE_NAME: inventory-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "127.0.0.1:8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
