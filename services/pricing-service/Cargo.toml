[package]
name = "pricing-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.0"
opentelemetry-instrumentation-tower = { version = "0.19.0", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
thiserror = "2"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serial_test = "3"
serde_json = "1"
