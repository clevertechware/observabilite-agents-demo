apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: demo
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: inventory-service
          image: ghcr.io/clevertechware/observabilite-agents-demo/inventory-service:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: inventory-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=shop,service.version=0.1.0,deployment.environment.name=demo
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: inventory-password}
            - name: DATABASE_URL
              value: postgres://inventory:$(INVENTORY_DB_PASSWORD)@postgres.demo.svc:5432/inventory?sslmode=disable
            - name: PRICING_URL
              value: http://pricing-service.demo.svc:8080
            - name: FAULT_SLOW_QUERY_SECONDS
              value: "0"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: demo
  labels:
    app: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8080
      targetPort: http
