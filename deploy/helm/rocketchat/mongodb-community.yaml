# mongodb-community.yaml
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
  namespace: rocketchat
spec:
  members: 1
  type: ReplicaSet
  version: "8.2.3"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: rocketchat
      db: rocketchat
      passwordSecretRef:
        name: mongodb-rocketchat-password
      roles:
        - name: readWrite
          db: rocketchat
      scramCredentialsSecretName: rocketchat-scram
  statefulSet:
    spec:
      template:
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  memory: 1Gi
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
