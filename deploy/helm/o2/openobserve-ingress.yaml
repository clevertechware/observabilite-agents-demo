# openobserve-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openobserve
  namespace: openobserve
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: openobserve-ip-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["o2.example.com"]
  rules:
    - host: o2.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: o2-openobserve-standalone
                port:
                  number: 5080
