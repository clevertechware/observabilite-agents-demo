clusterRole:
  rules:
    - apiGroups: [""]
      resources: ["nodes/pods", "nodes/metrics"]
      verbs: ["get"]

config:
  receivers:
    prometheus/cadvisor:
      config:
        scrape_configs:
          - job_name: kubelet-cadvisor
            scrape_interval: 30s
            scheme: https
            metrics_path: /metrics/cadvisor
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            static_configs:
              - targets: ["${env:K8S_NODE_IP}:10250"]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: container_fs_(reads|writes)_bytes_total
                action: keep
              - source_labels: [container]
                regex: ""
                action: drop

  processors:
    groupbyattrs/cadvisor:
      keys: [namespace, pod]
    transform/cadvisor:
      error_mode: ignore
      metric_statements:
        - conditions:
            - resource.attributes["pod"] != nil
          statements:
            - set(resource.attributes["k8s.namespace.name"], resource.attributes["namespace"])
            - set(resource.attributes["k8s.pod.name"], resource.attributes["pod"])
            - delete_key(resource.attributes, "namespace")
            - delete_key(resource.attributes, "pod")
    k8s_attributes:
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: resource_attribute
              name: k8s.pod.name
            - from: resource_attribute
              name: k8s.namespace.name
        - sources:
            - from: connection

  service:
    pipelines:
      metrics/cadvisor:
        receivers: [prometheus/cadvisor]
        processors:
          - memory_limiter
          - groupbyattrs/cadvisor
          - transform/cadvisor
          - k8s_attributes
          - batch
        exporters: [otlp_http/openobserve]
