mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
command:
  name: otelcol-k8s

presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true

resources:
  limits:
    memory: 512Mi

extraEnvs:
  - name: O2_AUTH
    valueFrom:
      secretKeyRef:
        name: otel-collector-auth
        key: authorization

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 15
    batch:
      send_batch_size: 512
      timeout: 5s
    filter/openobserve-ingest:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["k8s.namespace.name"] == "openobserve" and IsMatch(body, "POST /api/[^/ ]+/v1/(logs|metrics|traces) HTTP")'

  exporters:
    otlphttp/openobserve:
      endpoint: http://o2-openobserve-standalone.openobserve.svc:5080/api/default
      headers:
        Authorization: "${env:O2_AUTH}"

  service:
    extensions:
      - health_check
    pipelines:
      logs:
        processors:
          - memory_limiter
          - filter/openobserve-ingest
          - batch
        exporters:
          - otlphttp/openobserve
