service:
  enabled: true

config:
  receivers:
    file_log:
      exclude:
        - /var/log/pods/otel_otel-opentelemetry-collector*_*/opentelemetry-collector/*.log
        - /var/log/pods/demo_*/*/*.log

  service:
    pipelines:
      traces:
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp_http/openobserve
