presets:
  kubeletMetrics:
    enabled: true

clusterRole:
  rules:
    - apiGroups: [""]
      resources: ["nodes/pods"]
      verbs: ["get"]

config:
  receivers:
    kubeletstats:
      metrics:
        k8s.container.cpu_limit_utilization:
          enabled: true
        k8s.container.memory_limit_utilization:
          enabled: true

  service:
    pipelines:
      metrics:
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/openobserve
