# order-service-middlewares.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ip-allowlist
  namespace: demo
spec:
  ipAllowList:
    sourceRange:
      - "203.0.113.0/24"
      - "2001:db8:1234:5678::/64"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: demo
spec:
  rateLimit:
    average: 5
    period: 1s
    burst: 10
